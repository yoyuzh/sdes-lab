[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdes-lab"
version = "0.1.0"
description = "S-DES course desktop lab with key search and collision analysis"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "pytest-qt>=4.4", "ruff>=0.9"]

[project.scripts]
sdes-lab = "sdes.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sdes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
